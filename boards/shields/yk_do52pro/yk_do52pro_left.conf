CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Needed by the custom status screen
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_USE_THEME_MONO=y

# The built-in screen's 4096 default does not apply to a custom screen, and 2048
# is not enough for five labels -> lv_label_create() returns NULL and faults.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072

