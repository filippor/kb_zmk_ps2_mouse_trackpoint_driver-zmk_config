CONFIG_ZMK_DISPLAY=y

# Custom screen (src/status_screen.c): shows left + right battery
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
# Own UI thread so display work can't block the system work queue (USB/BLE)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# Host caps lock LED state for the CAPS indicator
CONFIG_ZMK_HID_INDICATORS=y
